services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memoria
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: memoria_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - memoria_postgres_data:/var/lib/postgresql/data

volumes:
  memoria_postgres_data:
